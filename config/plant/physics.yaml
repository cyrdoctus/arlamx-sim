# Default science-plant physics (v2.5 campaign numbers). Sentman stays default.
name: standard

gravity:
  model: ggm03s          # ggm03s | twobody (SH degree 0, GGM still loaded)
  degree: 4              # 0..70; twobody forces degree 0 (point mass only)
  lunisolar: false
  gradient_torque: true  # 3 mu/r^3 u x Iu (Markley & Crassidis 2014, ch. 3)

atmosphere:
  model: msis21          # msis21 | nrlmsise00 | constant
  # Seed values. v10+ envelopes overwrite f107/ap each episode.
  f107: 150.0
  ap: 4.0
  corotating: true
  interp: true           # 2nd MSIS sample at step end, linear in time (criticv1 F11)
  # constant: {rho: 3.0e-12, T: 900.0, m_bar: 2.656e-26}

aero:
  gsi: sentman           # sentman | cll
  alpha_E: 0.93          # Sentman only
  alpha_n: 1.0           # CLL Walker α_N (eq. 13 unused at exactly 1)
  alpha_t: 1.0           # CLL σ_T
  T_w: 300.0
  one_sided_ref: true

srp:
  enabled: true
  optical: true          # plate law along n and s (Montenbruck & Gill 2000, Sec. 3.4)
  optics: al_mylar       # partition from python/arlamx_v2/sail_optics.py
  Cr: 1.8                # cannonball law only (optical: false)
  earth: true            # Earth IR + albedo (Knocke et al. 1988 a0 = 0.34, e0 = 0.68)
  # Thermal-IR partition of the cell faces: absorptance = emittance 0.85, no
  # specular part in the IR [ASSUME; cover glass / polyimide 0.7-0.9].
  ir: {ca: 0.85, cs: 0.0, cd: 0.15}

magnetics:
  model: wmm             # wmm | dipole

attitude:
  law: mrp               # mrp | quaternion; CLI --controller overrides
  # false: magnetorquers through the local field (tau = m x B, no authority
  # about B). true: PD torque as an ideal body couple — the v2.1 plant the
  # campaign gains were tuned on. See docs/modules/15_control_magnetorquer.md
  # before training on `false` with the v7/v8 gains.
  ideal_torque: false

integrator:
  rk4_step_s: 2.0
