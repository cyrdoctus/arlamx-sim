# Docs check on every push. GitLab Pages publishes docs/ from the default branch.
# The plant build is manual: it installs environment.yml and runs the test suite.

stages:
  - check
  - test
  - deploy

check:
  stage: check
  image: python:3.12-slim
  script:
    - python3 tools/check_docs.py

# Installs the conda env, builds the C++ plant, and runs pytest.
# Start it from the GitLab pipeline page. It is not part of the default push.
plant:
  stage: test
  image: mambaorg/micromamba:2.0-debian12
  variables:
    MAMBA_ROOT_PREFIX: /opt/conda
  timeout: 2h
  rules:
    - when: manual
  script:
    - micromamba create -y -n arlamx -f environment.yml
    - micromamba run -n arlamx bash -c 'export ARLAMX_PYTHON="$(command -v python)"; ./build.sh && python main.py test'

pages:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdir -p public
    - cp -a docs/. public/
  artifacts:
    paths:
      - public
